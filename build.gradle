plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.0.0'
group = 'com.example'

// Принудительно говорим сборщику, где лежат наши ресурсы
sourceSets {
    main {
        resources {
            srcDirs = [
                'src/main/resources',
                'src/main/java/com/example/mixin/src/main/resources',
                'src/main/java/com/example/mixin'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.0"
}
